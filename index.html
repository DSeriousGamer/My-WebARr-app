<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Model Viewer</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; touch-action: none; }
  #intro { position: fixed; inset: 0; z-index: 20; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 14px; }
  #intro img { width: 140px; height: 140px; background: #fff; padding: 8px; border-radius: 8px; }
  #intro p { margin: 0; max-width: 340px; line-height: 1.4; color: #ccc; font-size: 15px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; background: #2f7cf6; color: #fff; padding: 12px 18px; font-size: 16px; }
  .btn.alt { background: #333; }
  #file { display: none; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: none; flex-direction: column; align-items: center; gap: 8px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  #status { color: #fff; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  #bar { display: flex; gap: 8px; }
  #bar button { background: rgba(0,0,0,.6); min-width: 56px; }
  #loading { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10; color: #fff; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 999px; font-size: 14px; display: none; }
</style>
</head>
<body>

<div id="intro">
  <h2 style="margin:0">AR Model Viewer</h2>
  <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro marker">
  <p>Show this Hiro marker on another screen or print it, then tap Start and point your camera at it.</p>
  <button id="start">Start AR</button>
  <label class="btn alt" for="file">Use my own .glb model</label>
  <input id="file" type="file" accept=".glb,.gltf,model/gltf-binary">
</div>

<div id="loading">Loading model…</div>

<div id="hud">
  <div id="status">Looking for the Hiro marker…</div>
  <div id="bar">
    <button id="smaller" aria-label="Smaller">−</button>
    <button id="bigger" aria-label="Bigger">+</button>
    <button id="turn" aria-label="Rotate 45 degrees">⟳ 45°</button>
    <button id="tilt" aria-label="Tilt">⤴ Tilt</button>
    <button id="reset" aria-label="Reset">Reset</button>
  </div>
</div>

<script>
  // ---- CONFIG: change this to any publicly hosted .glb (must allow CORS) ----
  var MODEL_URL = "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb";
  var BASE_SCALE = 0.35;   // size relative to marker width
  // ---------------------------------------------------------------------------

  var customUrl = null;
  var sceneEl = null;

  // Interaction state
  var st = { scale: 1, yaw: 0, pitch: 0 };
  function apply() {
    var m = document.getElementById('model');
    if (!m) return;
    var s = BASE_SCALE * st.scale;
    m.setAttribute('scale', s + ' ' + s + ' ' + s);
    m.setAttribute('rotation', st.pitch + ' ' + st.yaw + ' 0');
  }
  function clampScale(v) { return Math.min(5, Math.max(0.2, v)); }

  function buildScene(url) {
    var html =
      '<a-scene vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; alpha: true" ' +
      'arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" ' +
      'embedded style="position:fixed;inset:0;width:100%;height:100%">' +
        '<a-marker id="marker" preset="hiro">' +
          '<a-entity id="model" gltf-model="url(' + url + ')" position="0 0 0"></a-entity>' +
        '</a-marker>' +
        '<a-entity camera></a-entity>' +
      '</a-scene>';
    document.body.insertAdjacentHTML('afterbegin', html);
    sceneEl = document.querySelector('a-scene');

    var loading = document.getElementById('loading');
    loading.style.display = 'block';
    var model = document.getElementById('model');
    model.addEventListener('model-loaded', function () { loading.style.display = 'none'; apply(); });
    model.addEventListener('model-error', function () { loading.textContent = 'Could not load model'; });

    var status = document.getElementById('status');
    var marker = document.getElementById('marker');
    marker.addEventListener('markerFound', function () { status.textContent = 'Marker found – pinch, drag or use buttons'; });
    marker.addEventListener('markerLost', function () { status.textContent = 'Looking for the Hiro marker…'; });
    apply();
  }

  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (f) { customUrl = URL.createObjectURL(f); document.querySelector('#intro .btn').textContent = 'Model: ' + f.name; }
  });

  document.getElementById('start').addEventListener('click', function () {
    document.getElementById('intro').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    buildScene(customUrl || MODEL_URL);
  });

  // Buttons
  document.getElementById('bigger').onclick  = function () { st.scale = clampScale(st.scale * 1.25); apply(); };
  document.getElementById('smaller').onclick = function () { st.scale = clampScale(st.scale / 1.25); apply(); };
  document.getElementById('turn').onclick    = function () { st.yaw = (st.yaw + 45) % 360; apply(); };
  document.getElementById('tilt').onclick    = function () { st.pitch = (st.pitch + 30) % 360; apply(); };
  document.getElementById('reset').onclick   = function () { st = { scale: 1, yaw: 0, pitch: 0 }; apply(); };

  // Gestures: one finger drag = rotate, two-finger pinch = resize, double tap = reset
  var touches = {}, pinchStart = 0, scaleStart = 1, lastTap = 0;
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  window.addEventListener('touchstart', function (e) {
    if (e.target.closest('#hud, #intro')) return;
    for (var i = 0; i < e.touches.length; i++) touches[e.touches[i].identifier] = { x: e.touches[i].clientX, y: e.touches[i].clientY };
    var ids = Object.keys(touches);
    if (ids.length === 2) { pinchStart = dist(touches[ids[0]], touches[ids[1]]); scaleStart = st.scale; }
    if (ids.length === 1) { var now = Date.now(); if (now - lastTap < 300) { st = { scale: 1, yaw: 0, pitch: 0 }; apply(); } lastTap = now; }
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (e.target.closest('#hud, #intro')) return;
    var cur = {};
    for (var i = 0; i < e.touches.length; i++) cur[e.touches[i].identifier] = { x: e.touches[i].clientX, y: e.touches[i].clientY };
    var ids = Object.keys(cur);
    if (ids.length === 1 && touches[ids[0]]) {
      st.yaw += (cur[ids[0]].x - touches[ids[0]].x) * 0.6;
      st.pitch += (cur[ids[0]].y - touches[ids[0]].y) * 0.4;
      apply();
    } else if (ids.length === 2 && pinchStart) {
      st.scale = clampScale(scaleStart * dist(cur[ids[0]], cur[ids[1]]) / pinchStart);
      apply();
    }
    touches = cur;
  }, { passive: true });
  window.addEventListener('touchend', function (e) {
    touches = {};
    for (var i = 0; i < e.touches.length; i++) touches[e.touches[i].identifier] = { x: e.touches[i].clientX, y: e.touches[i].clientY };
    pinchStart = 0;
  }, { passive: true });
</script>
</body>
</html>
